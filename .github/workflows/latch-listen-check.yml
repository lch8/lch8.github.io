name: Latch Listen replay checks

on:
  push:
    branches: ['demo/latch-listen-step-review']
  pull_request:
    paths: ['public/demos/latch-listen/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: public/demos/latch-listen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.mjs
      - run: python -m pip install numpy==2.3.5
      - name: Replay both profiles on the original splits
        run: |
          python lab/step_eval.py --out "$RUNNER_TEMP/latch-steps.json"
          cat "$RUNNER_TEMP/latch-steps.json"
          if test -e results/steps.json; then diff -u results/steps.json "$RUNNER_TEMP/latch-steps.json"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: work-step-results
          path: ${{ runner.temp }}/latch-steps.json
